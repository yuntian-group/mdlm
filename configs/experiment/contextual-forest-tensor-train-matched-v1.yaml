schema_version: 1
protocol_id: contextual-forest-tensor-train-matched-v1
protocol_status: frozen_before_execution
scientific_scope: >-
  Descriptive unconditional OpenWebText-style generation comparison between
  the promoted dynamic/dynamic K=128 contextual-forest adapter and the released
  Tensor-Train feasibility matrix. This protocol does not estimate a diffusion
  ELBO, likelihood, perplexity, or a paired causal effect.

source:
  repository_revision: a574aca873d6de66a3b847c13efd1c7bc4efb66b
  require_clean_checkout: true

artifacts:
  backbone:
    path: /mnt/contextual-forest/checkpoints/mdlm-owt-backbone.pt
    sha256: 1b7c724d0228b1a2c825185c96642ffd706bd828b237f84512f0e1c7b5765573
  adapter:
    path: /mnt/contextual-forest/experiments/contextual-forest-causal-evidence-v1/runs/export--dynamic_dynamic--s001--k128/attempts/attempt-0001/adapter.safetensors
    sha256: c40d9bf0854059a85da88d4f0062ac280e4d7f621338845ae43357a7dfa69c4a
  adapter_manifest:
    path: /mnt/contextual-forest/experiments/contextual-forest-causal-evidence-v1/runs/export--dynamic_dynamic--s001--k128/attempts/attempt-0001/adapter-manifest.json
    sha256: d527f40926eda894e1ee5c9c1a91317353941463acbdfe059a279884fdbd2da9

generation:
  dataset_label: openwebtext
  num_samples: 256
  num_shards: 32
  sequence_length: 1024
  nfe_budgets: [8, 16, 32]
  sampling_modes: [structured_joint]
  batch_size: 1
  generation_seed: 260703
  candidate_top_k: 128
  temperature: 1.0
  schedule_policy: model_native_randomized_reverse_process_v1

evaluator:
  model_name_or_path: gpt2-large
  revision: 32b71b12589c2f8d625668d2335a01cac3249519
  batch_size: 8
  max_length: 1024
  dtype: float32
  sequence_policy: retokenize_decoded_text_score_through_first_nonleading_eos_v1

runtime:
  hardware: NVIDIA L4
  device: cuda
  one_process_per_exclusive_vm: true
  interruption_policy: >-
    Every shard is an atomic fresh attempt. Existing shards are reused only
    after full manifest, output-hash, record, seed, and summary replay.

comparison:
  external_artifact: artifacts/paper/tensor-train-feasibility/analysis.json
  external_arms: [marginal, tensor_train_rank4]
  aligned_fields:
    - dataset_label
    - num_samples
    - sequence_length
    - nfe_budgets
    - generation_seed
    - batch_size
    - evaluator_model_revision
    - evaluator_sequence_policy
    - hardware_model
  intentionally_unpaired_fields:
    - model_native_position_schedule
    - checkpoint_training_history

